# Publikasi situs ke GitHub Pages setiap ada perubahan di main.
# Aktifkan sekali di Settings > Pages > Source: "GitHub Actions".
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Hanya file situs yang dipublikasikan (README, QR, dan workflow tidak ikut).
      - name: Siapkan folder situs
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
